name: Synthetic tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Download-and-run smoke test
        run: |
          python -m codex_cleanup --help
          python codex-cleanup --version
      - name: Synthetic tests only
        run: python -m unittest discover -s tests -v
      - name: Compilation
        run: python -m compileall -q codex_cleanup tests
      - name: Pinned development linter
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.4
          ruff check .
          ruff format --check .
